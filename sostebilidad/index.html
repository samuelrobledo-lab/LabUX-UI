<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red de Apoyo Comunitario - Cali</title>

    <!-- Fuente Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            /* Colores de contenedores solicitados */
            --bg-header: #ABDDE3;
            --bg-placeholder: #A6D27D;
            --bg-body: #FAF6ED;
            --bg-panel: #FAF6ED;
            
            /* Tipografía: Gris muy negro (no 100% negro) */
            --text-dark: #1A1A1A;
            --text-muted: #2E2E2E;
            
            --border-subtle: rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- Estilos de la Cabecera Principal --- */
        header {
            background: var(--bg-header);
            color: var(--text-dark);
            padding: 1.2rem 2rem;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            margin: 0 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header .header-text-container {
            display: flex;
            flex-direction: column;
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 0.1rem;
            color: var(--text-dark);
        }

        header p {
            color: var(--text-muted);
            font-size: 0.88rem;
            font-weight: 500;
        }

        header .header-logo {
            max-height: 50px;
            width: auto;
            object-fit: contain;
        }

        /* --- Estilos del Contenedor Principal --- */
        .main-container {
            display: flex;
            flex: 1;
            width: 100%;
            height: calc(100vh - 110px); /* Ajuste de altura para tomar todo el viewport disponible */
            padding: 12px;
            gap: 12px;
        }

        aside {
            width: 400px;
            background: var(--bg-panel);
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border-subtle);
        }

        .filter-container {
            padding: 1rem 1.25rem 0.5rem 1.25rem;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .filter-group label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-dark);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-group select {
            width: 100%;
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid var(--border-subtle);
            background-color: #FFFFFF;
            font-size: 0.85rem;
            color: var(--text-dark);
            outline: none;
            font-weight: 500;
            cursor: pointer;
        }

        #info-panel {
            padding: 1.25rem;
            overflow-y: auto;
            flex: 1;
        }

        /* Arreglo de tamaño del contenedor del mapa */
        #map {
            flex: 1;
            width: 100%;
            height: 100%;
            min-height: 400px;
            border-radius: 28px;
            overflow: hidden;
            border: 1px solid var(--border-subtle);
        }

        .custom-svg-pin {
            background: transparent !important;
            border: none !important;
        }

        .placeholder-state {
            text-align: center;
            padding: 2.2rem 1.5rem;
            background: var(--bg-placeholder);
            border-radius: 24px;
            color: var(--text-dark);
        }

        .placeholder-state .icon-circle {
            width: 60px;
            height: 60px;
            background: #FFFFFF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin: 0 auto 1rem auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .placeholder-state h3 {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-dark);
        }

        .placeholder-state p {
            font-size: 0.85rem;
            line-height: 1.4;
            color: var(--text-dark);
            font-weight: 500;
        }

        .card-banner {
            background: var(--bg-placeholder);
            border-radius: 20px;
            padding: 1.2rem;
            margin-bottom: 1rem;
            color: var(--text-dark);
        }

        .card-insumos {
            background: #FFFFFF;
            border-radius: 20px;
            padding: 1.2rem;
            margin-bottom: 1rem;
            border: 1px solid var(--border-subtle);
        }

        .badge-urgencia {
            display: inline-block;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .btn-pill-back {
            background: var(--text-dark);
            color: #FFFFFF;
            border: none;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* --- Responsividad para móviles --- */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                text-align: center;
                gap: 10px;
            }

            .main-container {
                flex-direction: column-reverse;
                height: auto;
                padding: 8px;
            }

            aside {
                width: 100%;
            }

            #map {
                height: 400px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-text-container">
            <h1>Red de Apoyo Comunitario - Cali</h1>
            <p>Explora el mapa, filtra según las necesidades e interactúa con los puntos de acopio.</p>
        </div>
        
        <img src="assets/Logo_ayudandoando.png" alt="Logo Ayudando Ando" class="header-logo">
    </header>

    <main class="main-container">
        <!-- PANEL DE INFORMACIÓN Y FILTROS -->
        <aside>
            <div class="filter-container">
                <div class="filter-group">
                    <label for="filter-urgencia">Nivel de Urgencia</label>
                    <select id="filter-urgencia">
                        <option value="todos">Todas las urgencias</option>
                        <option value="Alta">Urgencia Alta</option>
                        <option value="Media">Urgencia Media</option>
                        <option value="Baja">Urgencia Baja</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="filter-insumo">Tipo de Insumo</label>
                    <select id="filter-insumo">
                        <option value="todos">Todos los insumos</option>
                        <option value="Alimentos">Alimentos / Granos</option>
                        <option value="Construcción">Materiales de Construcción</option>
                        <option value="Ropa">Ropa y Calzado</option>
                        <option value="Bebés">Artículos para Bebé / Leche</option>
                        <option value="Higiene">Higiene / Salud</option>
                    </select>
                </div>
            </div>

            <div id="info-panel">
                <div class="placeholder-state">
                    <div class="icon-circle">📍</div>
                    <h3>Selecciona un punto en el mapa</h3>
                    <p>Haz clic en cualquier pin para consultar la ubicación, los insumos requeridos y el porcentaje actual alcanzado.</p>
                </div>
            </div>
        </aside>

        <!-- MAPA -->
        <div id="map"></div>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- JavaScript propio -->
    <script src="script.js"></script>

</body>
</html>
